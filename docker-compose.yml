services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount local data so models/db persist outside the container
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
